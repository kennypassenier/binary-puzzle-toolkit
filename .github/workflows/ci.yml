name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: archlinux
            os: ubuntu-latest
            container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain deps (Arch container)
        if: matrix.name == 'archlinux'
        run: pacman -Syu --noconfirm gcc curl git
      - name: Install Rust (rustup, respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  perf:
    name: performance thresholds (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # K13/G5 assert only in release: a debug build is an order of
      # magnitude slower and would fail meaninglessly. Without this job
      # nothing automated ever checks the speed promises.
      - name: Threshold test, solver (release)
        run: cargo test --release -p bpt-core --test thresholds -- --nocapture
      - name: Threshold test, generator (release)
        run: cargo test --release -p bpt-forge --test thresholds -- --nocapture
      # AR25: fail when p95 drifts past 1.5x what was recorded. Only the
      # affordable geometries are re-measured; the file says which.
      - name: Generation baseline (release)
        run: cargo test --release -p bpt-forge --test baseline -- --nocapture

  generator-validation:
    name: D1 sweep and the invented types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Release only, and out of the commit gates: these take many
      # minutes. D1 puts a batch of every geometry through the solver;
      # K28 does the same for the two types the site does not publish.
      # Both are marked #[ignore] so a commit never waits on them.
      - name: D1 validation sweep
        run: cargo test --release -p bpt --test validation -- --ignored --nocapture
      - name: Invented types end to end
        run: cargo test --release -p bpt --test invented_types -- --ignored --nocapture
      - name: Format vectors and the tag grammar
        run: cargo test --release -p bpt-core --test specials --test format_vectors

  restore-drill:
    name: restore drill from a fresh clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # M30 asks for a clone into an empty directory on purpose: it
      # proves the fixture batch is really committed and really restores,
      # rather than being reproduced from whatever the working tree
      # happens to hold.
      - name: Clone into an empty directory
        run: git clone --no-hardlinks . "$RUNNER_TEMP/restore-clone"
      - name: Regenerate the stored batch from its manifest
        working-directory: ${{ runner.temp }}/restore-clone
        run: cargo test --release -p bpt --test restore_drill -- --nocapture

  core-zero-deps:
    name: core has no runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert bpt-core [dependencies] is empty
        run: |
          python3 - <<'EOF'
          import re, sys
          text = open('bpt-core/Cargo.toml').read()
          m = re.search(r'^\[dependencies\]\s*(.*?)(?=^\[|\Z)', text, re.S | re.M)
          deps = [l for l in (m.group(1).splitlines() if m else [])
                  if l.strip() and not l.strip().startswith('#')]
          if deps:
              print('bpt-core has runtime dependencies (AR1 violation):')
              print('\n'.join(deps))
              sys.exit(1)
          print('OK: bpt-core is dependency-free')
          EOF

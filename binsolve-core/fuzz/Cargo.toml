[package]
name = "binsolve-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.binsolve-core]
path = ".."

# Not a workspace member: fuzzing needs nightly, the workspace is stable.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "solve"
path = "fuzz_targets/solve.rs"
test = false
doc = false
bench = false
